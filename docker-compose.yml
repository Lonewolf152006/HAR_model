version: '3.8'

services:
  astroflow-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astroflow-ai-node
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - API_PROXY_TARGET=http://localhost:8080
      - NODE_ENV=production
    # Pass host video device if available on Linux/Edge nodes
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./videos:/app/videos
      - ./logs:/app/logs
